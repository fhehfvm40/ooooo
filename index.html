<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>소방 점검 앱</title>
    <!-- 보고서 PNG 이미지 내보내기를 위한 html2canvas CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* ==========================================
           1. 디자인 토큰 및 기본 리셋
        =========================================== */
        :root {
            --primary: #dc2626;
            --primary-dark: #b91c1c;
            --primary-light: #fef2f2;
            --amber: #d97706;
            --amber-dark: #b45309;
            --amber-light: #fffbeb;
            --amber-border: #fcd34d;
            --blue: #2563eb;
            --blue-dark: #1d4ed8;
            --blue-light: #eff6ff;
            --green: #059669;
            --green-dark: #047857;
            --green-light: #ecfdf5;
            --green-border: #a7f3d0;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --text: #0f172a;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, sans-serif;
            background-color: var(--gray-100);
            color: var(--text);
            line-height: 1.45;
        }

        /* ==========================================
           2. 상단 고정 3탭 네비게이션
        =========================================== */
        .top-header-wrap {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #ffffff;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.07);
        }

        .tab-nav {
            display: flex;
            max-width: 520px;
            margin: 0 auto;
            background: #ffffff;
        }

        .tab-btn {
            flex: 1;
            min-height: 52px;
            padding: 12px 4px;
            border: none;
            border-bottom: 3px solid transparent;
            background: transparent;
            color: var(--gray-500);
            font-size: 13.5px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: color 0.15s, border-color 0.15s, background-color 0.15s;
            white-space: nowrap;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background-color: #fffafa;
        }

        .tab-btn.edit-active {
            color: var(--amber-dark);
            border-bottom-color: var(--amber);
            background-color: var(--amber-light);
        }

        .count-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            background: var(--gray-200);
            color: var(--gray-700);
        }

        .tab-btn.active .count-badge {
            background: var(--primary);
            color: #ffffff;
        }

        /* ==========================================
           3. 공통 섹션 및 카드 레이아웃
        =========================================== */
        .view-section {
            display: none;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 14px 12px 64px 12px;
        }

        .view-section.active {
            display: block;
        }

        .card {
            background: #ffffff;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
            margin-bottom: 14px;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .app-title {
            text-align: center;
            color: var(--primary);
            font-size: 20px;
            font-weight: 800;
            margin: 0 0 16px 0;
            letter-spacing: -0.3px;
        }

        /* ==========================================
           4. 탭 1: 점검 작성 / 수정 폼
        =========================================== */
        .edit-banner {
            display: none;
            background: var(--amber-light);
            border: 1.5px solid var(--amber-border);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 14px;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .edit-banner.show {
            display: flex;
        }

        .edit-banner-text {
            font-size: 13.5px;
            font-weight: 800;
            color: var(--amber-dark);
            line-height: 1.35;
        }

        .btn-cancel-edit {
            flex-shrink: 0;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--amber);
            background: #ffffff;
            color: var(--amber-dark);
            font-size: 12.5px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
        }

        .btn-cancel-edit:active {
            background: #fef3c7;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-label {
            display: block;
            font-size: 13.5px;
            font-weight: 700;
            color: var(--gray-700);
            margin-bottom: 6px;
        }

        .text-input,
        .date-input {
            width: 100%;
            min-height: 46px;
            padding: 11px 12px;
            border: 1.5px solid var(--gray-300);
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text);
            background: #ffffff;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .text-input:focus,
        .date-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
        }

        .photo-section {
            background: var(--gray-50);
            border: 1.5px solid var(--gray-200);
            border-radius: 12px;
            padding: 13px;
            margin-bottom: 12px;
        }

        .photo-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--gray-800);
            margin-bottom: 8px;
        }

        .file-input {
            width: 100%;
            font-size: 13.5px;
            color: var(--gray-600);
            padding: 6px 0;
        }

        .preview-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .inline-img {
            display: none;
            width: 100%;
            max-height: 190px;
            object-fit: contain;
            border-radius: 8px;
            border: 1px solid var(--gray-300);
            background: #111827;
            cursor: pointer;
        }

        .btn-remove-photo {
            display: none;
            padding: 8px 16px;
            border-radius: 999px;
            border: 1px solid #fecaca;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 12.5px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
        }

        .btn-remove-photo:active {
            transform: scale(0.96);
        }

        /* 폼 하단 버튼 그룹 */
        .form-btn-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 18px;
        }

        .form-btn-row {
            display: flex;
            gap: 8px;
        }

        .btn {
            min-height: 46px;
            padding: 12px 14px;
            border: none;
            border-radius: 10px;
            font-size: 14.5px;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: transform 0.1s, opacity 0.15s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            width: 100%;
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 3px 10px rgba(220, 38, 38, 0.25);
        }

        .btn-amber {
            width: 100%;
            background: var(--amber);
            color: #ffffff;
            box-shadow: 0 3px 10px rgba(217, 119, 6, 0.28);
        }

        .btn-blue {
            flex: 1.4;
            background: var(--blue);
            color: #ffffff;
            box-shadow: 0 3px 8px rgba(37, 99, 235, 0.22);
        }

        .btn-outline {
            flex: 1;
            background: #ffffff;
            color: var(--gray-700);
            border: 1.5px solid var(--gray-300);
        }

        .btn-green {
            flex: 1;
            background: var(--green);
            color: #ffffff;
            box-shadow: 0 3px 8px rgba(5, 150, 105, 0.22);
        }

        .btn-gray {
            flex: 0.9;
            background: var(--gray-600);
            color: #ffffff;
        }

        /* ==========================================
           5. 탭 2: 월별·일별 캘린더 체크
        =========================================== */
        .cal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .cal-nav-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cal-nav-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--gray-200);
            background: var(--gray-50);
            color: var(--gray-800);
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cal-nav-btn:active {
            background: var(--gray-200);
        }

        .cal-month-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--gray-800);
            min-width: 112px;
            text-align: center;
        }

        .btn-today {
            min-height: 36px;
            padding: 6px 14px;
            border-radius: 8px;
            border: 1.5px solid var(--blue);
            background: var(--blue-light);
            color: var(--blue);
            font-size: 13px;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
        }

        .month-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            background: var(--green-light);
            border: 1px solid var(--green-border);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: 700;
            color: #065f46;
        }

        .summary-num {
            color: var(--green-dark);
            font-size: 14.5px;
            font-weight: 800;
        }

        .cal-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 12px;
            font-weight: 800;
            color: var(--gray-500);
            padding-bottom: 6px;
            border-bottom: 1px solid var(--gray-200);
            margin-bottom: 6px;
        }

        .cal-weekdays div:first-child { color: var(--primary); }
        .cal-weekdays div:last-child { color: var(--blue); }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .cal-cell {
            min-height: 54px;
            border-radius: 10px;
            padding: 5px 2px 4px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            border: 1.5px solid transparent;
            background: #ffffff;
            cursor: pointer;
            transition: background-color 0.12s, border-color 0.12s;
        }

        .cal-cell.empty {
            cursor: default;
            background: transparent;
        }

        .cal-cell:not(.empty):hover {
            background: var(--gray-50);
        }

        .cal-day-num {
            font-size: 13px;
            font-weight: 700;
            color: var(--gray-800);
        }

        .cal-cell.sun .cal-day-num { color: var(--primary); }
        .cal-cell.sat .cal-day-num { color: var(--blue); }

        .cal-cell.checked {
            background: var(--green-light);
            border-color: var(--green-border);
        }

        .cal-cell.today {
            border-color: var(--blue);
        }

        .cal-cell.selected {
            border-color: var(--primary);
            background: var(--primary-light);
            box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.18);
        }

        .cal-cell.checked.selected {
            background: #d1fae5;
            border-color: var(--green-dark);
            box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.25);
        }

        .cal-check-badge {
            margin-top: 3px;
            font-size: 10px;
            font-weight: 800;
            color: #065f46;
            background: #ffffff;
            border: 1px solid #6ee7b7;
            border-radius: 999px;
            padding: 1px 4px;
            line-height: 1.2;
        }

        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .filter-btn {
            flex: 1;
            min-height: 42px;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1.5px solid var(--gray-200);
            background: #ffffff;
            color: var(--gray-600);
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
        }

        .filter-btn.active {
            border-color: var(--blue);
            background: var(--blue-light);
            color: var(--blue);
        }

        .quick-add-btn {
            width: 100%;
            min-height: 46px;
            padding: 10px 12px;
            margin-bottom: 14px;
            border-radius: 10px;
            border: 1.5px dashed var(--primary);
            background: var(--primary-light);
            color: var(--primary);
            font-size: 14px;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .quick-add-btn:active {
            background: #fee2e2;
        }

        /* ==========================================
           6. 기록 카드 리스트 (캘린더 & 보관함 공용)
        =========================================== */
        .archive-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 2px;
        }

        .archive-title {
            font-size: 17px;
            font-weight: 800;
            color: var(--gray-800);
            margin: 0;
        }

        .archive-subtitle {
            font-size: 12.5px;
            font-weight: 700;
            color: var(--gray-500);
        }

        .record-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .record-card {
            background: #ffffff;
            border: 1px solid var(--gray-200);
            border-radius: 13px;
            padding: 14px;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
        }

        .record-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .record-date-tag {
            display: inline-block;
            font-size: 11.5px;
            font-weight: 800;
            color: var(--green-dark);
            background: var(--green-light);
            padding: 3px 8px;
            border-radius: 6px;
        }

        .photo-count-tag {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--gray-500);
        }

        .record-place {
            font-size: 16px;
            font-weight: 800;
            color: var(--gray-800);
            margin-bottom: 2px;
            word-break: break-word;
        }

        .record-loc {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--gray-600);
            word-break: break-word;
        }

        .thumb-strip {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin: 10px 0 12px 0;
        }

        .thumb-box {
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            overflow: hidden;
            background: var(--gray-50);
        }

        .thumb-label {
            font-size: 10.5px;
            font-weight: 700;
            text-align: center;
            padding: 3px 0;
            background: var(--gray-100);
            color: var(--gray-600);
            border-bottom: 1px solid var(--gray-200);
        }

        .thumb-img-wrap {
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            overflow: hidden;
        }

        .thumb-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }

        .thumb-empty {
            font-size: 11px;
            color: var(--gray-400);
        }

        .card-actions {
            display: grid;
            grid-template-columns: 1.2fr 1fr 0.9fr;
            gap: 6px;
        }

        .btn-card {
            min-height: 40px;
            padding: 8px 6px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border: none;
        }

        .btn-card-report {
            background: var(--blue);
            color: #ffffff;
        }

        .btn-card-edit {
            background: var(--amber-light);
            color: var(--amber-dark);
            border: 1px solid var(--amber-border);
        }

        .btn-card-delete {
            background: var(--primary-light);
            color: var(--primary);
            border: 1px solid #fecaca;
        }

        .empty-state {
            text-align: center;
            background: #ffffff;
            border-radius: 12px;
            padding: 36px 16px;
            color: var(--gray-500);
            font-size: 14px;
            border: 1.5px dashed var(--gray-300);
        }

        .empty-state-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        /* ==========================================
           7. 보고서 양식 (캡처 / PNG 저장 모드)
        =========================================== */
        .report-top-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .report-top-bar .btn {
            font-size: 13px;
            padding: 10px 8px;
        }

        .report-edit-btn {
            flex: 1;
            background: var(--amber);
            color: #ffffff;
            box-shadow: 0 3px 8px rgba(217, 119, 6, 0.22);
        }

        .report-tip {
            text-align: center;
            font-size: 12px;
            color: var(--gray-500);
            margin: 0 0 10px 0;
        }

        .report-box {
            background: #ffffff;
            padding: 12px;
            border: 2px solid #000000;
            box-sizing: border-box;
        }

        .report-title {
            text-align: center;
            font-size: 18px;
            font-weight: 800;
            color: #000000;
            border-bottom: 2px solid #000000;
            padding-bottom: 7px;
            margin: 0 0 8px 0;
            letter-spacing: 1px;
        }

        .report-info {
            font-size: 12.5px;
            font-weight: 700;
            color: #111111;
            border-bottom: 1px dashed #888888;
            padding-bottom: 7px;
            margin-bottom: 8px;
        }

        .report-info-row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 3px;
        }

        .report-info-row:last-child {
            margin-bottom: 0;
        }

        .report-grid {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .report-item {
            border: 1px solid #000000;
            display: flex;
            flex-direction: column;
        }

        .report-item-title {
            background: #eeeeee;
            text-align: center;
            font-size: 12px;
            font-weight: 800;
            color: #000000;
            padding: 4px;
            border-bottom: 1px solid #000000;
        }

        /* 전/중/후 모두 동일한 고정 높이 155px */
        .report-item-content {
            position: relative;
            height: 155px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .report-item-content span {
            font-size: 12px;
            color: #999999;
        }

        .report-item-content img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            cursor: pointer;
            background: #fafafa;
        }

        /* ==========================================
           8. 전체화면 이미지 확대 모달
        =========================================== */
        .image-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.92);
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .image-modal img {
            max-width: 100%;
            max-height: 88vh;
            border-radius: 8px;
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 20px;
            color: #ffffff;
            font-size: 36px;
            font-weight: 700;
            line-height: 1;
            cursor: pointer;
        }

        /* ==========================================
           9. 커스텀 알림 토스트 & 확인 모달
        =========================================== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(15, 23, 42, 0.95);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 999px;
            font-size: 13.5px;
            font-weight: 700;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.22s, transform 0.22s;
            max-width: 92vw;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .confirm-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9998;
            background: rgba(15, 23, 42, 0.55);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .confirm-box {
            width: 100%;
            max-width: 320px;
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
            text-align: center;
        }

        .confirm-msg {
            margin: 0 0 18px 0;
            font-size: 15px;
            font-weight: 700;
            color: var(--gray-800);
            line-height: 1.5;
        }

        .confirm-actions {
            display: flex;
            gap: 10px;
        }

        .confirm-btn-cancel {
            flex: 1;
            min-height: 44px;
            border-radius: 10px;
            border: 1px solid var(--gray-300);
            background: #ffffff;
            color: var(--gray-700);
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
        }

        .confirm-btn-ok {
            flex: 1;
            min-height: 44px;
            border-radius: 10px;
            border: none;
            background: var(--primary);
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ==========================================
         상단 고정 3탭 네비게이션
    =========================================== -->
    <header id="topHeader" class="top-header-wrap">
        <nav class="tab-nav">
            <button type="button" id="tabBtnWrite" class="tab-btn active" onclick="switchTab('write')">
                📝 점검 작성
            </button>
            <button type="button" id="tabBtnCalendar" class="tab-btn" onclick="switchTab('calendar')">
                📅 월별·일별 체크
            </button>
            <button type="button" id="tabBtnArchive" class="tab-btn" onclick="switchTab('archive')">
                🗂️ 기록 보관함
                <span id="archiveCountBadge" class="count-badge">0</span>
            </button>
        </nav>
    </header>

    <!-- ==========================================
         [탭 1] 점검 작성 및 기존 보고서 수정 폼
    =========================================== -->
    <main id="viewWrite" class="view-section active">
        <div class="card">
            <h1 class="app-title">🚨 소방 점검 현장기록</h1>

            <!-- 기존 보고서 수정 모드 배너 -->
            <div id="editBanner" class="edit-banner">
                <div class="edit-banner-text">✏️ 기존 보고서를 수정하고 있습니다</div>
                <button type="button" class="btn-cancel-edit" onclick="cancelEditMode()">수정 취소</button>
            </div>

            <div class="input-group">
                <label class="input-label" for="placeInput">🏢 점검 장소</label>
                <input type="text" id="placeInput" class="text-input" placeholder="예: 한국아파트 101동" oninput="handleDraftChange()">
            </div>

            <div class="input-group">
                <label class="input-label" for="locInput">📍 점검 위치</label>
                <input type="text" id="locInput" class="text-input" placeholder="예: 1층 A동 소화전" oninput="handleDraftChange()">
            </div>

            <div class="input-group">
                <label class="input-label" for="dateInput">📅 점검 일자</label>
                <input type="date" id="dateInput" class="date-input">
            </div>

            <!-- 1. 점검 전 (Before) -->
            <div class="photo-section">
                <div class="photo-title">📸 1. 점검 전 (Before)</div>
                <input type="file" id="uploadBefore" class="file-input" accept="image/*"
                       onchange="handlePhotoUpload(this, 'before')">
                <div class="preview-wrap">
                    <img id="imgBefore" class="inline-img" alt="점검 전 사진" onclick="openModal(this.src)">
                    <button type="button" id="btnRemoveBefore" class="btn-remove-photo" onclick="clearPhoto('before')">
                        🗑️ 사진 지우기
                    </button>
                </div>
            </div>

            <!-- 2. 점검 중 (During) -->
            <div class="photo-section">
                <div class="photo-title">📸 2. 점검 중 (During)</div>
                <input type="file" id="uploadDuring" class="file-input" accept="image/*"
                       onchange="handlePhotoUpload(this, 'during')">
                <div class="preview-wrap">
                    <img id="imgDuring" class="inline-img" alt="점검 중 사진" onclick="openModal(this.src)">
                    <button type="button" id="btnRemoveDuring" class="btn-remove-photo" onclick="clearPhoto('during')">
                        🗑️ 사진 지우기
                    </button>
                </div>
            </div>

            <!-- 3. 점검 후 (After) -->
            <div class="photo-section">
                <div class="photo-title">📸 3. 점검 후 (After)</div>
                <input type="file" id="uploadAfter" class="file-input" accept="image/*"
                       onchange="handlePhotoUpload(this, 'after')">
                <div class="preview-wrap">
                    <img id="imgAfter" class="inline-img" alt="점검 후 사진" onclick="openModal(this.src)">
                    <button type="button" id="btnRemoveAfter" class="btn-remove-photo" onclick="clearPhoto('after')">
                        🗑️ 사진 지우기
                    </button>
                </div>
            </div>

            <!-- 저장 / 미리보기 / 초기화 버튼 -->
            <div class="form-btn-stack">
                <button type="button" id="btnSavePrimary" class="btn btn-primary" onclick="saveOrUpdateRecord()">
                    💾 앱에 기록 저장하기
                </button>
                <div class="form-btn-row">
                    <button type="button" class="btn btn-blue" onclick="openFormReportPreview()">
                        📸 보고서 양식 미리보기
                    </button>
                    <button type="button" class="btn btn-outline" onclick="requestResetForm()">
                        🔄 입력 초기화
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- ==========================================
         [탭 2] 월별·일별 캘린더 체크
    =========================================== -->
    <section id="viewCalendar" class="view-section">
        <div class="card">
            <div class="cal-header">
                <div class="cal-nav-group">
                    <button type="button" class="cal-nav-btn" onclick="changeMonth(-1)" aria-label="이전 달">◀</button>
                    <div id="calMonthTitle" class="cal-month-title">2026년 11월</div>
                    <button type="button" class="cal-nav-btn" onclick="changeMonth(1)" aria-label="다음 달">▶</button>
                </div>
                <button type="button" class="btn-today" onclick="jumpToToday()">오늘</button>
            </div>

            <div class="month-summary">
                <div>이번 달 점검 완료 일수: <span id="summaryDays" class="summary-num">0일</span></div>
                <div>총 점검 건수: <span id="summaryCount" class="summary-num">0건</span></div>
            </div>

            <div class="cal-weekdays">
                <div>일</div>
                <div>월</div>
                <div>화</div>
                <div>수</div>
                <div>목</div>
                <div>금</div>
                <div>토</div>
            </div>

            <div id="calGrid" class="cal-grid"></div>
        </div>

        <div class="filter-bar">
            <button type="button" id="filterDayBtn" class="filter-btn active" onclick="setCalendarFilter('day')">
                📌 선택한 날짜
            </button>
            <button type="button" id="filterMonthBtn" class="filter-btn" onclick="setCalendarFilter('month')">
                📆 이번 달 전체 보기
            </button>
        </div>

        <button type="button" id="quickAddBtn" class="quick-add-btn" onclick="startWriteForSelectedDate()">
            + 선택한 날짜 점검 작성하기
        </button>

        <div id="calendarRecordList" class="record-list"></div>
    </section>

    <!-- ==========================================
         [탭 3] 기록 보관함 (전체 목록)
    =========================================== -->
    <section id="viewArchive" class="view-section">
        <div class="archive-header">
            <h2 class="archive-title">🗂️ 저장된 점검 기록</h2>
            <span id="archiveTotalText" class="archive-subtitle">총 0건</span>
        </div>
        <div id="archiveRecordList" class="record-list"></div>
    </section>

    <!-- ==========================================
         [전용 뷰] 보고서 양식 (캡처 / PNG 저장)
    =========================================== -->
    <section id="viewReport" class="view-section">
        <div class="report-top-bar">
            <button type="button" class="btn btn-gray" onclick="closeReportView()">↩ 돌아가기</button>
            <button type="button" class="btn report-edit-btn" onclick="editCurrentReport()">✏️ 보고서 수정</button>
            <button type="button" id="btnDownloadPng" class="btn btn-green" onclick="downloadReportPng()">💾 이미지로 저장</button>
        </div>
        <p class="report-tip">👇 아래 양식을 캡처하거나 [이미지로 저장]을 눌러 PNG로 보관하세요.</p>

        <div id="reportBox" class="report-box">
            <h2 class="report-title">소방 시설 점검 사진 대지</h2>

            <div class="report-info">
                <div class="report-info-row">
                    <div>장소: <span id="repPlace" style="color: var(--primary);">미입력</span></div>
                    <div>일자: <span id="repDate">-</span></div>
                </div>
                <div class="report-info-row">
                    <div>위치: <span id="repLoc" style="color: var(--blue);">미입력</span></div>
                </div>
            </div>

            <div class="report-grid">
                <div class="report-item">
                    <div class="report-item-title">점검 전</div>
                    <div class="report-item-content">
                        <span id="repTextBefore">사진 없음</span>
                        <img id="repImgBefore" alt="점검 전" onclick="openModal(this.src)">
                    </div>
                </div>

                <div class="report-item">
                    <div class="report-item-title">점검 중</div>
                    <div class="report-item-content">
                        <span id="repTextDuring">사진 없음</span>
                        <img id="repImgDuring" alt="점검 중" onclick="openModal(this.src)">
                    </div>
                </div>

                <div class="report-item">
                    <div class="report-item-title">점검 후</div>
                    <div class="report-item-content">
                        <span id="repTextAfter">사진 없음</span>
                        <img id="repImgAfter" alt="점검 후" onclick="openModal(this.src)">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ==========================================
         전체화면 이미지 확대 모달
    =========================================== -->
    <div id="imageModal" class="image-modal" onclick="closeModal()">
        <span class="modal-close" aria-label="닫기">&times;</span>
        <img id="modalImg" src="" alt="확대 사진">
    </div>

    <!-- ==========================================
         커스텀 확인 모달 (confirm 대체)
    =========================================== -->
    <div id="confirmOverlay" class="confirm-overlay">
        <div class="confirm-box">
            <p id="confirmMsg" class="confirm-msg"></p>
            <div class="confirm-actions">
                <button type="button" class="confirm-btn-cancel" onclick="resolveConfirm(false)">취소</button>
                <button type="button" id="confirmOkBtn" class="confirm-btn-ok" onclick="resolveConfirm(true)">확인</button>
            </div>
        </div>
    </div>

    <!-- ==========================================
         커스텀 알림 토스트 (alert 대체)
    =========================================== -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
        /* ==========================================
           상수 및 전역 상태 관리
        =========================================== */
        const STORAGE_KEY_RECORDS = 'fire_inspection_records_v2';
        const STORAGE_KEY_DRAFT = 'fire_inspection_draft_v2';

        let records = [];
        let formPhotos = { before: null, during: null, after: null };

        // 수정 모드 상태: null이면 신규 작성, 문자열 ID면 기존 보고서 수정 중
        let editingRecordId = null;
        // 보고서 뷰 상태: 현재 보고서 화면이 참조하는 기록 ID (신규 미리보기면 null)
        let activeReportRecordId = null;
        // 보고서 화면에서 돌아갈 이전 탭
        let previousTab = 'write';

        // 캘린더 상태 (로컬 시간 기준 오늘 날짜)
        const initialToday = new Date();
        let calYear = initialToday.getFullYear();
        let calMonth = initialToday.getMonth(); // 0 ~ 11
        let selectedDateStr = getLocalDateYMD(initialToday);
        let calendarFilterMode = 'day'; // 'day' | 'month'

        // 모달/토스트 제어용
        let confirmCallback = null;
        let toastTimer = null;

        /* ==========================================
           초기화 (DOM 로드 완료 시)
        =========================================== */
        window.onload = function () {
            document.getElementById('dateInput').value = getLocalDateYMD(new Date());
            loadRecordsFromStorage();
            loadDraftToForm();
            updateAllCounts();
            renderCalendarView();
            renderArchiveView();
        };

        /* ==========================================
           날짜 및 문자열 유틸리티
        =========================================== */
        function getLocalDateYMD(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function formatKoreanDate(ymd) {
            if (!ymd) return '-';
            const parts = ymd.split('-');
            if (parts.length !== 3) return ymd;
            return `${parts[0]}년 ${parseInt(parts[1], 10)}월 ${parseInt(parts[2], 10)}일`;
        }

        function formatMonthDay(ymd) {
            if (!ymd) return '';
            const parts = ymd.split('-');
            if (parts.length !== 3) return ymd;
            return `${parseInt(parts[1], 10)}월 ${parseInt(parts[2], 10)}일`;
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function sortRecordsDesc(list) {
            return [...list].sort((a, b) => {
                if (a.dateStr !== b.dateStr) {
                    return a.dateStr < b.dateStr ? 1 : -1;
                }
                return (b.updatedAt || Number(b.id) || 0) - (a.updatedAt || Number(a.id) || 0);
            });
        }

        /* ==========================================
           커스텀 토스트 및 확인 모달
        =========================================== */
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function openConfirm(message, okLabel, onConfirm) {
            document.getElementById('confirmMsg').innerText = message;
            document.getElementById('confirmOkBtn').innerText = okLabel || '확인';
            confirmCallback = onConfirm;
            document.getElementById('confirmOverlay').style.display = 'flex';
        }

        function resolveConfirm(isConfirmed) {
            document.getElementById('confirmOverlay').style.display = 'none';
            if (isConfirmed && typeof confirmCallback === 'function') {
                confirmCallback();
            }
            confirmCallback = null;
        }

        /* ==========================================
           탭 전환 및 뷰 표시 제어
        =========================================== */
        function switchTab(tabName) {
            const topHeader = document.getElementById('topHeader');
            const sections = document.querySelectorAll('.view-section');
            sections.forEach(sec => sec.classList.remove('active'));

            if (tabName === 'report') {
                topHeader.style.display = 'none';
                document.getElementById('viewReport').classList.add('active');
                window.scrollTo(0, 0);
                return;
            }

            previousTab = tabName;
            topHeader.style.display = 'block';

            const btnWrite = document.getElementById('tabBtnWrite');
            const btnCal = document.getElementById('tabBtnCalendar');
            const btnArchive = document.getElementById('tabBtnArchive');

            btnWrite.classList.remove('active', 'edit-active');
            btnCal.classList.remove('active');
            btnArchive.classList.remove('active');

            if (tabName === 'write') {
                document.getElementById('viewWrite').classList.add('active');
                btnWrite.classList.add(editingRecordId ? 'edit-active' : 'active');
            } else if (tabName === 'calendar') {
                document.getElementById('viewCalendar').classList.add('active');
                btnCal.classList.add('active');
                renderCalendarView();
            } else if (tabName === 'archive') {
                document.getElementById('viewArchive').classList.add('active');
                btnArchive.classList.add('active');
                renderArchiveView();
            }
            window.scrollTo(0, 0);
        }

        function closeReportView() {
            switchTab(previousTab || 'write');
        }

        /* ==========================================
           localStorage 데이터 저장/로드 및 임시 저장
        =========================================== */
        function loadRecordsFromStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY_RECORDS);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        records = parsed;
                        return;
                    }
                }
                records = [];
            } catch (e) {
                console.error('기록 불러오기 실패:', e);
                records = [];
            }
        }

        function saveRecordsToStorage() {
            localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(records));
            updateAllCounts();
        }

        function updateAllCounts() {
            document.getElementById('archiveCountBadge').innerText = records.length;
            document.getElementById('archiveTotalText').innerText = `총 ${records.length}건`;
        }

        // 신규 작성 모드일 때만 장소/위치 텍스트 자동 임시 저장
        function handleDraftChange() {
            if (editingRecordId !== null) return;
            try {
                const draft = {
                    place: document.getElementById('placeInput').value,
                    location: document.getElementById('locInput').value
                };
                localStorage.setItem(STORAGE_KEY_DRAFT, JSON.stringify(draft));
            } catch (e) {
                console.error('임시 저장 오류:', e);
            }
        }

        function loadDraftToForm() {
            if (editingRecordId !== null) return;
            try {
                const raw = localStorage.getItem(STORAGE_KEY_DRAFT);
                if (raw) {
                    const draft = JSON.parse(raw);
                    document.getElementById('placeInput').value = draft.place || '';
                    document.getElementById('locInput').value = draft.location || '';
                }
            } catch (e) {
                console.error('임시 저장 로드 오류:', e);
            }
        }

        function clearDraftStorage() {
            try {
                localStorage.removeItem(STORAGE_KEY_DRAFT);
            } catch (e) {
                console.error('임시 저장 삭제 오류:', e);
            }
        }

        /* ==========================================
           사진 업로드 (Canvas 800px / JPEG 0.65 압축) 및 삭제
        =========================================== */
        function getPhotoDomIds(phase) {
            const cap = phase.charAt(0).toUpperCase() + phase.slice(1);
            return {
                input: `upload${cap}`,
                img: `img${cap}`,
                removeBtn: `btnRemove${cap}`
            };
        }

        function applyPhotoPreview(phase, dataUrl) {
            const ids = getPhotoDomIds(phase);
            const imgEl = document.getElementById(ids.img);
            const btnEl = document.getElementById(ids.removeBtn);

            formPhotos[phase] = dataUrl || null;

            if (dataUrl) {
                imgEl.src = dataUrl;
                imgEl.style.display = 'block';
                btnEl.style.display = 'inline-block';
            } else {
                imgEl.src = '';
                imgEl.style.display = 'none';
                btnEl.style.display = 'none';
            }
        }

        function handlePhotoUpload(inputEl, phase) {
            if (!inputEl.files || !inputEl.files[0]) return;

            const file = inputEl.files[0];
            const reader = new FileReader();

            reader.onload = function (event) {
                const img = new Image();
                img.onload = function () {
                    try {
                        const MAX_DIM = 800;
                        let w = img.width;
                        let h = img.height;

                        if (w > h && w > MAX_DIM) {
                            h = Math.round(h * (MAX_DIM / w));
                            w = MAX_DIM;
                        } else if (h > MAX_DIM) {
                            w = Math.round(w * (MAX_DIM / h));
                            h = MAX_DIM;
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);

                        const compressed = canvas.toDataURL('image/jpeg', 0.65);
                        applyPhotoPreview(phase, compressed);
                    } catch (err) {
                        console.error('이미지 압축 실패:', err);
                        showToast('사진을 처리하는 중 오류가 발생했습니다.');
                    }
                };
                img.onerror = function () {
                    showToast('이미지 파일을 읽을 수 없습니다.');
                };
                img.src = event.target.result;
            };

            reader.readAsDataURL(file);
        }

        function clearPhoto(phase) {
            const ids = getPhotoDomIds(phase);
            const inputEl = document.getElementById(ids.input);
            // 동일 파일 재첨부가 가능하도록 input.value 초기화
            inputEl.value = '';
            applyPhotoPreview(phase, null);
        }

        /* ==========================================
           수정 모드(Edit Mode) 진입 / 취소 / 초기화
        =========================================== */
        function syncEditModeUI() {
            const banner = document.getElementById('editBanner');
            const tabBtn = document.getElementById('tabBtnWrite');
            const saveBtn = document.getElementById('btnSavePrimary');

            if (editingRecordId !== null) {
                banner.classList.add('show');
                tabBtn.innerText = '✏️ 기존 보고서 수정 중';
                saveBtn.innerText = '✅ 수정 내용 저장하기';
                saveBtn.className = 'btn btn-amber';
            } else {
                banner.classList.remove('show');
                tabBtn.innerText = '📝 점검 작성';
                saveBtn.innerText = '💾 앱에 기록 저장하기';
                saveBtn.className = 'btn btn-primary';
            }
        }

        function startEditRecord(recordId) {
            const target = records.find(r => r.id === recordId);
            if (!target) {
                showToast('수정할 보고서를 찾을 수 없습니다.');
                return;
            }

            editingRecordId = target.id;
            document.getElementById('placeInput').value = target.place || '';
            document.getElementById('locInput').value = target.location || '';
            document.getElementById('dateInput').value = target.dateStr || getLocalDateYMD(new Date());

            // 파일 입력창 초기화 후 기존 사진 세팅
            ['before', 'during', 'after'].forEach(phase => {
                const ids = getPhotoDomIds(phase);
                document.getElementById(ids.input).value = '';
                const photoData = target.photos ? target.photos[phase] : null;
                applyPhotoPreview(phase, photoData);
            });

            syncEditModeUI();
            switchTab('write');
            showToast('✏️ 보고서 수정 모드로 불러왔습니다.');
        }

        function cancelEditMode() {
            editingRecordId = null;
            clearFormFields(false);
            loadDraftToForm();
            syncEditModeUI();
            switchTab('write');
            showToast('수정을 취소했습니다.');
        }

        function clearFormFields(alsoClearDraft) {
            document.getElementById('placeInput').value = '';
            document.getElementById('locInput').value = '';
            document.getElementById('dateInput').value = getLocalDateYMD(new Date());
            clearPhoto('before');
            clearPhoto('during');
            clearPhoto('after');
            if (alsoClearDraft) {
                clearDraftStorage();
            }
        }

        function requestResetForm() {
            const msg = editingRecordId
                ? '수정 중인 내용을 초기화하고 새 작성 모드로 전환할까요?'
                : '현재 입력한 내용과 사진을 모두 초기화할까요?';
            openConfirm(msg, '초기화', function () {
                editingRecordId = null;
                clearFormFields(true);
                syncEditModeUI();
                switchTab('write');
                showToast('입력 내용을 초기화했습니다.');
            });
        }

        /* ==========================================
           기록 저장 및 수정 반영 (localStorage)
        =========================================== */
        function saveOrUpdateRecord() {
            const place = document.getElementById('placeInput').value.trim();
            const location = document.getElementById('locInput').value.trim();
            const dateStr = document.getElementById('dateInput').value || getLocalDateYMD(new Date());

            if (!place) {
                showToast('점검 장소를 입력해주세요.');
                document.getElementById('placeInput').focus();
                return;
            }
            if (!location) {
                showToast('점검 위치를 입력해주세요.');
                document.getElementById('locInput').focus();
                return;
            }

            const photosSnapshot = {
                before: formPhotos.before || null,
                during: formPhotos.during || null,
                after: formPhotos.after || null
            };

            const isEditing = editingRecordId !== null;
            const backupRecords = [...records];

            if (isEditing) {
                const idx = records.findIndex(r => r.id === editingRecordId);
                if (idx === -1) {
                    showToast('원본 보고서를 찾을 수 없어 새로 저장합니다.');
                    editingRecordId = null;
                } else {
                    records[idx] = {
                        ...records[idx],
                        place: place,
                        location: location,
                        dateStr: dateStr,
                        photos: photosSnapshot,
                        updatedAt: Date.now()
                    };
                }
            }

            if (!isEditing || editingRecordId === null) {
                const newRecord = {
                    id: String(Date.now()),
                    place: place,
                    location: location,
                    dateStr: dateStr,
                    photos: photosSnapshot,
                    updatedAt: Date.now()
                };
                records.unshift(newRecord);
            }

            try {
                saveRecordsToStorage();

                // 캘린더를 저장/수정한 날짜로 동기화
                const parts = dateStr.split('-');
                if (parts.length === 3) {
                    calYear = parseInt(parts[0], 10);
                    calMonth = parseInt(parts[1], 10) - 1;
                    selectedDateStr = dateStr;
                    calendarFilterMode = 'day';
                }

                editingRecordId = null;
                clearFormFields(!isEditing);
                if (isEditing) {
                    loadDraftToForm();
                }
                syncEditModeUI();
                renderCalendarView();
                renderArchiveView();

                showToast(isEditing ? '✅ 보고서 수정 내용이 저장되었습니다!' : '💾 점검 기록이 저장되었습니다!');
                switchTab(isEditing ? 'archive' : 'calendar');
            } catch (err) {
                // 용량 초과 시 안전하게 복구 및 한국어 안내
                records = backupRecords;
                console.error('localStorage 저장 오류:', err);
                showToast('저장 공간이 부족합니다! 기록 보관함에서 오래된 기록을 삭제한 후 다시 시도해주세요.');
            }
        }

        function requestDeleteRecord(recordId) {
            openConfirm('이 점검 기록을 영구 삭제하시겠습니까?', '삭제', function () {
                records = records.filter(r => r.id !== recordId);
                if (editingRecordId === recordId) {
                    editingRecordId = null;
                    clearFormFields(false);
                    syncEditModeUI();
                }
                try {
                    saveRecordsToStorage();
                    renderCalendarView();
                    renderArchiveView();
                    showToast('🗑️ 기록이 삭제되었습니다.');
                } catch (e) {
                    showToast('삭제 처리 중 오류가 발생했습니다.');
                }
            });
        }

        /* ==========================================
           탭 2: 월별·일별 캘린더 렌더링
        =========================================== */
        function changeMonth(delta) {
            calMonth += delta;
            if (calMonth < 0) {
                calMonth = 11;
                calYear -= 1;
            } else if (calMonth > 11) {
                calMonth = 0;
                calYear += 1;
            }
            const prefix = `${calYear}-${String(calMonth + 1).padStart(2, '0')}`;
            if (!selectedDateStr.startsWith(prefix)) {
                selectedDateStr = `${prefix}-01`;
            }
            renderCalendarView();
        }

        function jumpToToday() {
            const today = new Date();
            calYear = today.getFullYear();
            calMonth = today.getMonth();
            selectedDateStr = getLocalDateYMD(today);
            calendarFilterMode = 'day';
            renderCalendarView();
        }

        function selectCalendarDate(ymd) {
            selectedDateStr = ymd;
            calendarFilterMode = 'day';
            renderCalendarView();
        }

        function setCalendarFilter(mode) {
            calendarFilterMode = mode;
            renderCalendarControls();
            renderCalendarRecordList();
        }

        function startWriteForSelectedDate() {
            if (editingRecordId !== null) {
                editingRecordId = null;
                clearFormFields(false);
                loadDraftToForm();
                syncEditModeUI();
            }
            document.getElementById('dateInput').value = selectedDateStr;
            switchTab('write');
            showToast(`${formatMonthDay(selectedDateStr)} 점검을 작성합니다.`);
        }

        function renderCalendarView() {
            const monthNum = calMonth + 1;
            const monthPrefix = `${calYear}-${String(monthNum).padStart(2, '0')}`;
            const todayStr = getLocalDateYMD(new Date());

            document.getElementById('calMonthTitle').innerText = `${calYear}년 ${monthNum}월`;

            // 해당 월의 날짜별 기록 수 집계
            const countByDate = {};
            let monthTotal = 0;
            records.forEach(r => {
                if (r.dateStr && r.dateStr.startsWith(monthPrefix)) {
                    countByDate[r.dateStr] = (countByDate[r.dateStr] || 0) + 1;
                    monthTotal += 1;
                }
            });

            document.getElementById('summaryDays').innerText = `${Object.keys(countByDate).length}일`;
            document.getElementById('summaryCount').innerText = `${monthTotal}건`;

            const grid = document.getElementById('calGrid');
            grid.innerHTML = '';

            const firstWeekday = new Date(calYear, calMonth, 1).getDay();
            const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

            for (let i = 0; i < firstWeekday; i++) {
                const empty = document.createElement('div');
                empty.className = 'cal-cell empty';
                grid.appendChild(empty);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const ymd = `${monthPrefix}-${String(day).padStart(2, '0')}`;
                const weekday = (firstWeekday + day - 1) % 7;
                const count = countByDate[ymd] || 0;

                const cell = document.createElement('div');
                cell.className = 'cal-cell';
                if (weekday === 0) cell.classList.add('sun');
                if (weekday === 6) cell.classList.add('sat');
                if (count > 0) cell.classList.add('checked');
                if (ymd === todayStr) cell.classList.add('today');
                if (ymd === selectedDateStr) cell.classList.add('selected');

                cell.onclick = function () {
                    selectCalendarDate(ymd);
                };

                let cellHtml = `<div class="cal-day-num">${day}</div>`;
                if (count > 0) {
                    cellHtml += `<div class="cal-check-badge">✅${count}</div>`;
                }
                cell.innerHTML = cellHtml;
                grid.appendChild(cell);
            }

            renderCalendarControls();
            renderCalendarRecordList();
        }

        function renderCalendarControls() {
            const monthNum = calMonth + 1;
            const dayBtn = document.getElementById('filterDayBtn');
            const monthBtn = document.getElementById('filterMonthBtn');
            const quickBtn = document.getElementById('quickAddBtn');

            dayBtn.innerText = `📌 ${formatMonthDay(selectedDateStr)} 보기`;
            monthBtn.innerText = `📆 ${monthNum}월 전체 보기`;

            dayBtn.classList.toggle('active', calendarFilterMode === 'day');
            monthBtn.classList.toggle('active', calendarFilterMode === 'month');

            if (calendarFilterMode === 'day') {
                quickBtn.style.display = 'flex';
                quickBtn.innerText = `+ ${formatMonthDay(selectedDateStr)} 점검 작성하기`;
            } else {
                quickBtn.style.display = 'none';
            }
        }

        function renderCalendarRecordList() {
            const container = document.getElementById('calendarRecordList');
            const monthPrefix = `${calYear}-${String(calMonth + 1).padStart(2, '0')}`;

            const filtered = sortRecordsDesc(records.filter(r => {
                if (calendarFilterMode === 'day') {
                    return r.dateStr === selectedDateStr;
                }
                return r.dateStr && r.dateStr.startsWith(monthPrefix);
            }));

            const emptyMessage = calendarFilterMode === 'day'
                ? `${formatMonthDay(selectedDateStr)}에 저장된 점검 기록이 없습니다.<br>위 버튼을 눌러 바로 작성해 보세요.`
                : `${calYear}년 ${calMonth + 1}월에 저장된 점검 기록이 없습니다.`;

            renderRecordCardsInto(container, filtered, emptyMessage);
        }

        /* ==========================================
           탭 3: 기록 보관함 렌더링
        =========================================== */
        function renderArchiveView() {
            const container = document.getElementById('archiveRecordList');
            const sorted = sortRecordsDesc(records);
            renderRecordCardsInto(
                container,
                sorted,
                '아직 저장된 소방 점검 기록이 없습니다.<br>[📝 점검 작성] 탭에서 첫 기록을 남겨보세요.'
            );
        }

        function renderRecordCardsInto(container, list, emptyHtml) {
            container.innerHTML = '';

            if (!list.length) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <div>${emptyHtml}</div>
                    </div>
                `;
                return;
            }

            list.forEach(record => {
                const photos = record.photos || {};
                const photoCount = [photos.before, photos.during, photos.after].filter(Boolean).length;

                const card = document.createElement('div');
                card.className = 'record-card';

                const makeThumb = (src, alt) => src
                    ? `<img src="${src}" alt="${alt}" onclick="openModal(this.src)">`
                    : `<span class="thumb-empty">없음</span>`;

                card.innerHTML = `
                    <div class="record-meta">
                        <span class="record-date-tag">✅ ${formatKoreanDate(record.dateStr)}</span>
                        <span class="photo-count-tag">사진 ${photoCount}/3</span>
                    </div>
                    <div class="record-place">${escapeHtml(record.place)}</div>
                    <div class="record-loc">📍 ${escapeHtml(record.location)}</div>
                    <div class="thumb-strip">
                        <div class="thumb-box">
                            <div class="thumb-label">점검 전</div>
                            <div class="thumb-img-wrap">${makeThumb(photos.before, '점검 전')}</div>
                        </div>
                        <div class="thumb-box">
                            <div class="thumb-label">점검 중</div>
                            <div class="thumb-img-wrap">${makeThumb(photos.during, '점검 중')}</div>
                        </div>
                        <div class="thumb-box">
                            <div class="thumb-label">점검 후</div>
                            <div class="thumb-img-wrap">${makeThumb(photos.after, '점검 후')}</div>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button type="button" class="btn-card btn-card-report" onclick="openSavedReport('${record.id}')">
                            📄 보고서
                        </button>
                        <button type="button" class="btn-card btn-card-edit" onclick="startEditRecord('${record.id}')">
                            ✏️ 수정
                        </button>
                        <button type="button" class="btn-card btn-card-delete" onclick="requestDeleteRecord('${record.id}')">
                            🗑️ 삭제
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        /* ==========================================
           보고서 양식 뷰 / 보고서에서 바로 수정 / PNG 다운로드
        =========================================== */
        function openFormReportPreview() {
            // 현재 작성(또는 수정) 중인 폼 내용으로 보고서 열기
            activeReportRecordId = editingRecordId;
            populateReportBox({
                place: document.getElementById('placeInput').value.trim() || '미입력',
                location: document.getElementById('locInput').value.trim() || '미입력',
                dateStr: document.getElementById('dateInput').value || getLocalDateYMD(new Date()),
                photos: formPhotos
            });
            switchTab('report');
        }

        function openSavedReport(recordId) {
            const target = records.find(r => r.id === recordId);
            if (!target) {
                showToast('보고서를 찾을 수 없습니다.');
                return;
            }
            activeReportRecordId = target.id;
            populateReportBox(target);
            switchTab('report');
        }

        function editCurrentReport() {
            // 저장된 보고서를 보고 있었다면 바로 수정 모드로 로드
            if (activeReportRecordId) {
                if (editingRecordId === activeReportRecordId && previousTab === 'write') {
                    switchTab('write');
                    return;
                }
                startEditRecord(activeReportRecordId);
                return;
            }
            // 아직 저장 전인 폼 미리보기였다면 작성 탭으로 바로 복귀
            switchTab('write');
        }

        function populateReportBox(data) {
            document.getElementById('repPlace').innerText = data.place || '미입력';
            document.getElementById('repLoc').innerText = data.location || '미입력';
            document.getElementById('repDate').innerText = formatKoreanDate(data.dateStr);

            const photos = data.photos || {};
            setReportPhotoSlot('Before', photos.before);
            setReportPhotoSlot('During', photos.during);
            setReportPhotoSlot('After', photos.after);
        }

        function setReportPhotoSlot(capPhase, src) {
            const img = document.getElementById(`repImg${capPhase}`);
            const text = document.getElementById(`repText${capPhase}`);
            if (src) {
                img.src = src;
                img.style.display = 'block';
                text.style.display = 'none';
            } else {
                img.src = '';
                img.style.display = 'none';
                text.style.display = 'block';
            }
        }

        function downloadReportPng() {
            if (typeof html2canvas === 'undefined') {
                showToast('이미지 저장 기능을 불러오는 중입니다. 잠시 후 다시 시도해주세요.');
                return;
            }

            const box = document.getElementById('reportBox');
            const btn = document.getElementById('btnDownloadPng');
            const originalText = btn.innerText;

            const safePlace = (document.getElementById('repPlace').innerText || '현장').replace(/[\\/:*?"<>|\s]+/g, '_');
            const safeDate = (document.getElementById('repDate').innerText || '').replace(/\s+/g, '');

            btn.innerText = '⏳ 저장 중...';
            btn.disabled = true;

            html2canvas(box, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#ffffff'
            }).then(canvas => {
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = `소방점검_${safePlace}_${safeDate}.png`;
                link.click();
                showToast('💾 보고서 이미지(PNG)가 저장되었습니다!');
            }).catch(err => {
                console.error('PNG 내보내기 오류:', err);
                showToast('이미지 저장 중 오류가 발생했습니다.');
            }).finally(() => {
                btn.innerText = originalText;
                btn.disabled = false;
            });
        }

        /* ==========================================
           전체화면 이미지 확대 모달
        =========================================== */
        function openModal(src) {
            if (!src || src === window.location.href) return;
            document.getElementById('modalImg').src = src;
            document.getElementById('imageModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }
    </script>
</body>
</html>
