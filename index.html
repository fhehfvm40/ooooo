<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>소방 점검 앱</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f4f9; padding: 10px; margin: 0; color: #333; }
        
        /* 1. 입력 영역 스타일 */
        .container { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin: auto; margin-bottom: 15px; }
        h1 { text-align: center; color: #e53e3e; font-size: 20px; margin-top: 0; margin-bottom: 15px; }
        
        .input-group { margin-bottom: 12px; }
        label { font-weight: bold; display: block; margin-bottom: 4px; font-size: 13px; color: #555; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        input[readonly] { background-color: #f9f9f9; color: #777; }
        
        .photo-section { border: 1px solid #e2e8f0; padding: 12px; margin-bottom: 10px; border-radius: 8px; background-color: #f8fafc; }
        .photo-title { font-weight: bold; margin-bottom: 8px; font-size: 14px; color: #1e293b; }
        input[type="file"] { width: 100%; font-size: 13px; }
        
        .inline-img { width: 100%; max-height: 150px; object-fit: contain; margin-top: 10px; display: none; border-radius: 6px; border: 1px solid #cbd5e1; cursor: pointer; }

        /* 버튼 스타일 */
        .btn-capture { display: block; width: 100%; max-width: 500px; margin: 0 auto 20px auto; background-color: #2563eb; color: white; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.2); cursor: pointer; }
        
        .capture-ui { text-align: center; margin-bottom: 15px; display: none; }
        .btn-group { display: flex; justify-content: center; gap: 10px; }
        .btn-back { background-color: #475569; color: white; padding: 12px 15px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.2); cursor: pointer; flex: 1; max-width: 200px; }
        .btn-save { background-color: #10b981; color: white; padding: 12px 15px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.2); cursor: pointer; flex: 1; max-width: 200px; }

        /* 2. 캡처용 한눈에 보기 보고서 양식 */
        .report-box { background: white; padding: 10px; border: 2px solid #000; max-width: 500px; margin: auto; box-sizing: border-box; }
        .report-title { text-align: center; font-size: 18px; font-weight: bold; border-bottom: 2px solid #000; padding-bottom: 8px; margin: 0 0 10px 0; letter-spacing: 1px; }
        
        .report-info { font-size: 12px; font-weight: bold; margin-bottom: 10px; border-bottom: 1px dashed #999; padding-bottom: 8px; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
        
        .grid-container { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .grid-item { border: 1px solid #000; display: flex; flex-direction: column; }
        .item-title { background: #eee; text-align: center; font-weight: bold; font-size: 12px; padding: 4px; border-bottom: 1px solid #000; }
        
        .item-content { position: relative; background: #fff; display: flex; align-items: center; justify-content: center; height: 150px; }
        .item-content span { color: #aaa; font-size: 12px; }
        .item-content img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; display: none; cursor: pointer; }

        /* 모달 스타일 */
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); align-items: center; justify-content: center; }
        .modal-content { max-width: 95%; max-height: 90%; border-radius: 8px; object-fit: contain; }
        .close-btn { position: absolute; top: 15px; right: 25px; color: white; font-size: 35px; font-weight: bold; cursor: pointer; }

        /* ==========================================
           3. 저장(인쇄/PDF) 시 적용되는 전용 스타일
           버튼들은 싹 숨기고 흰 배경에 보고서만 출력되도록 함
           ========================================== */
        @media print {
            body { background: white; margin: 0; padding: 0; }
            #inputSection, #btnCapture, #captureUI, .modal { display: none !important; }
            .report-box { border: none; max-width: 100%; width: 100%; }
        }
    </style>
</head>
<body>

    <!-- 돌아가기 및 저장 버튼 영역 -->
    <div id="captureUI" class="capture-ui">
        <div class="btn-group">
            <button class="btn-back" onclick="toggleMode(false)">↩ 다시 입력(수정)</button>
            <button class="btn-save" onclick="window.print()">💾 PDF로 저장</button>
        </div>
        <p style="font-size: 12px; color: #666; margin-top: 10px;">저장 버튼을 누르면 기기에 PDF 파일로 깔끔하게 저장됩니다.</p>
    </div>

    <!-- 1. 현장 입력 폼 -->
    <div id="inputSection" class="container">
        <h1>🚨 소방 점검 현장기록</h1>
        
        <div class="input-group">
            <label>🏢 점검 장소</label>
            <input type="text" id="placeInput" placeholder="예: 한국아파트 101동" oninput="updatePlace()">
        </div>

        <div class="input-group">
            <label>📍 점검 위치</label>
            <input type="text" id="locInput" placeholder="예: 1층 A동 소화전" oninput="updateLocation()">
        </div>
        
        <div class="input-group">
            <label>📅 점검 일자</label>
            <input type="text" id="dateInput" readonly>
        </div>

        <div class="photo-section">
            <div class="photo-title">📸 1. 점검 전 (Before)</div>
            <input type="file" accept="image/*" onchange="showImage(this, 'inlineBefore', 'repImgBefore', 'repTextBefore')">
            <img id="inlineBefore" class="inline-img" onclick="openModal(this.src)">
        </div>

        <div class="photo-section">
            <div class="photo-title">📸 2. 점검 중 (During)</div>
            <input type="file" accept="image/*" onchange="showImage(this, 'inlineDuring', 'repImgDuring', 'repTextDuring')">
            <img id="inlineDuring" class="inline-img" onclick="openModal(this.src)">
        </div>

        <div class="photo-section">
            <div class="photo-title">📸 3. 점검 후 (After)</div>
